# A .md in Latin-1, not UTF-8. The Markdown page could not keep its bytes,
# so the app refuses it with the open error and leaves the file as it was.
# Builds before the backend refused it logged [OPEN] markdown success.
description = "Markdown that is not UTF-8: refused with the open error dialog, file unchanged"
generate = "mkmd.py latin1"
input = "latin1.md"
input_sha256 = "b7193605623260b69ac6386676697b159ec90e155d748f2f24c8f8e5c9f7c045"
action = "open"
expect = "rejected-with-dialog"
control_expect = "opens"
screenshot = "on-failure"
