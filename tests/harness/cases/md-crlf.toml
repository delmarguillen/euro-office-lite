# The same Markdown with CRLF line endings. The save must be the input with
# Z at the end, every line still ending in CRLF.
# The page opens in preview: the runner presses Edit, the lone Shifts wait for the editor.
description = "Markdown with CRLF: Ctrl+S after typing Z keeps CRLF on every line and every byte"
generate = "mkmd.py crlf"
input = "notes-crlf.md"
input_sha256 = "db93347bb9ea15fb2fd98a7f89f78bba696d6d02016724d8803df269d3ed70b7"
action = "open-edit-save"
button = "Edit"
keys_before = "shift shift shift shift shift shift shift shift shift shift ctrl+End"
type = "Z"
check = "expected-bytes"
expected_generate = "mkmd.py crlf z"
expected_sha256 = "caeb0d873e5e8e3c81edd81a74d4ad564d412e97128a3788beecece6b4d05e0f"
expect = "saved-as-expected"
screenshot = "on-failure"
