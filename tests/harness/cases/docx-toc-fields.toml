# Open a DOCX whose fields hold stale results, update every field through the
# API of the editor (no keys) and ask the editor for the text of the
# document: the table of contents, the numbers of the headings and a caption
# numbered by chapter.
# The first heading is on page ii of a section numbered in lower-case roman
# numbers, the second on page 1 of a section numbered in arabic numbers; the
# caption is STYLEREF 1 \s, a hyphen and SEQ Figure \s 1.
# The table of contents gives the page of the first heading as ii, the
# number of its roman section, not 2. A build without that fix gives 2,
# which is what control_expect holds.
description = "DOCX with a table of contents, numbered headings and a chapter caption: after updating the fields the contents read ii and 1, and the caption 2-1"
generate = "mkdocxtoc.py"
input = "contents.docx"
input_sha256 = "36d9e6a5bf8a73f15510c8486bb791cafcc11d1819f97533a520f708a758e791"
platforms = "linux"
action = "open-probe"
do = "word-update-fields.js"
probe = "word-text.js"
match_1 = '^pages=3$'
match_2 = '^text=1 Preface heading ii$'
match_3 = '^text=2 Main heading 1$'
match_4 = '^text=1 \| Preface heading$'
match_5 = '^text=2 \| Main heading$'
match_6 = '^text=Figure 2-1$'
expect = "state-as-expected"
control_expect = "state-mismatch"
screenshot = "on-failure"
