# Open a DOCX, type a word, wait until the app has recorded the change in its
# recovery folder, kill the app and start it again with no document: its log
# says the start screen got one session to offer. The case does not press
# Recover, and the recovery folder is emptied when it ends.
description = "DOCX: open, type, kill the app, start it again; the start screen gets the document to offer for recovery"
generate = "mkdocx.py 2"
input = "recover.docx"
action = "edit-kill-recover"
keys_before = "ctrl+End"
type = " Harness75recover"
expect = "recovery-offered"
screenshot = "on-failure"
