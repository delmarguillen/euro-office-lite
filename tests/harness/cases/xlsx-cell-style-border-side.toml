# Open the XLSX of xlsx-cell-style-roundtrip and give the left side of the
# cell style Totals a medium green line, through the API the cell style
# dialog uses for one side (no keys), then ask the editor for the cells: B1,
# which has that style, gets the new left side and keeps its thin red bottom
# and its empty top, and C1, of another style, keeps its thin blue sides.
# The editor sets one side of a cell style with asc_setBorderSide. A build
# without it has no such function, the `do` says so and the case ends in
# do-failed, which is what control_expect holds.
description = "XLSX with cell styles: set the left border of a style with its line and colour"
generate = "mkxlsxstyles.py"
input = "styles.xlsx"
input_sha256 = "1e2e85487fb2f613a2509b45ce8a2d1ef894f0446d581578fa8ebaf1d7134a74"
platforms = "linux"
action = "open-probe"
do = "sheet-style-border.js Totals left Medium 00B050"
probe = "sheet-cells.js B1 C1"
match_1 = '^B1\.style=Totals$'
match_2 = '^B1\.border\.left=Medium 00B050$'
match_3 = '^B1\.border\.bottom=Thin FF0000$'
match_4 = '^B1\.border\.top=none$'
match_5 = '^B1\.border\.right=none$'
match_6 = '^C1\.border\.left=Thin 0000FF$'
expect = "state-as-expected"
control_expect = "do-failed"
screenshot = "on-failure"
