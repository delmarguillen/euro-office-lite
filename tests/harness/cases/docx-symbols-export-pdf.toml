# Open a DOCX in Liberation Sans with symbols and emoji and export it to PDF.
# The case is judged by the structure of the PDF, not only by its text: the
# font of the text is embedded as a subset and maps to Unicode, no font is
# left out of the file, no glyph is glyph 0 (the box a font draws for a
# character it does not have), and the text has the white smiling face and
# the arrow, which Liberation Sans has.
# The check mark (U+2713) and the emoji (U+1F600, U+1F44D) are in the
# document too: the app brings a font for them, so they are in the text
# of the PDF. A build without it leaves them out, glyph and text, and
# match_7 and match_8 fail, which is what control_expect holds.
description = "DOCX with symbols: the exported PDF embeds its fonts, has no glyph 0 and has the symbols of the text font"
generate = "mkdocxsymbols.py"
input = "symbols.docx"
input_sha256 = "188f14ce0192b9b343d055a39ad7bacff09f26f2ea122d50c73acf3de59c886a"
platforms = "linux"
action = "open-export-pdf"
check = "pdf-structure"
match_1 = '^font=Liberation Sans type=CID TrueType embedded=yes subset=yes unicode=yes$'
match_2 = '^fonts\.not-embedded=0$'
match_3 = '^glyphs=[1-9][0-9]+$'
match_4 = '^notdef=0$'
match_5 = '^text=Symbols: ☺ →'
match_6 = '^text=Emoji:'
match_7 = '^text=Symbols: ☺ → ✓$'
match_8 = '^text=Emoji: 😀 👍$'
expect = "exported-as-expected"
control_expect = "exported-missing-content"
screenshot = "on-failure"
