[package]
name = "euro-office-lite"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "3"
arboard = { version = "3", features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Only to rewrite the docx package when the footnote separator is removed (#42):
# deflate is the single method a docx uses besides stored, so the rest of the
# codecs stay out of the binary.
zip = { version = "2", default-features = false, features = ["deflate"] }
# flock for the recovery session lock. Nothing heavier: a file-locking crate
# would be a dependency for two calls, and libc is already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-printer-v2 = "0.2.4"

# Pinned to the version wry links, so PlatformWebview::inner() hands back a
# WebView of the same type rather than a second, incompatible binding.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# The WebKitWebView is a GtkWidget; gtk provides the event hook used to claim
# the touchpad pinch. Same version webkit2gtk resolves, so nothing new is pulled.
gtk = "0.18"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
