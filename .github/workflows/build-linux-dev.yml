name: Linux Dev Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'hotfix/**'
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/build-linux-dev.yml'

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"

jobs:
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The sdkjs tag has to match the x2t the target ships. Both targets
          # take x2t 10.0.0.169 from the dependencies release, and its sdkjs tag
          # exists only upstream, not in this fork.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            sdkjs_tag: v10.0.0.169
            sdkjs_remote: https://github.com/ONLYOFFICE/sdkjs.git
            sdkjs_commit: 3679e0375a758d7dc59d31337a45461be3525ed8
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            sdkjs_tag: v10.0.0.169
            sdkjs_remote: https://github.com/ONLYOFFICE/sdkjs.git
            sdkjs_commit: 3679e0375a758d7dc59d31337a45461be3525ed8

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Diagnose environment
        run: |
          echo "::group::System info"
          uname -a
          lsb_release -a 2>/dev/null || cat /etc/os-release
          echo "Arch: $(uname -m)"
          echo "glibc: $(ldd --version | head -1)"
          echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          echo "::endgroup::"

          echo "::group::Tool versions"
          rustc --version && cargo --version
          node --version && npm --version
          python3 --version
          java -version 2>&1 || echo "WARNING: Java not found (needed for Closure Compiler)"
          echo "::endgroup::"

          echo "::group::Disk space"
          df -h /
          echo "::endgroup::"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            python3-pip

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-dev-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-dev-${{ runner.os }}-${{ matrix.target }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Generate sdkjs develop scripts
        run: |
          echo "::group::grunt-develop"
          cd src/sdkjs/build
          npm ci
          npx grunt develop --desktop=true
          cd "$GITHUB_WORKSPACE"

          WORD_SCRIPTS="src/sdkjs/develop/sdkjs/word/scripts.js"
          if ! grep -q 'word/document/editor\.js' "$WORD_SCRIPTS" 2>/dev/null; then
            echo "Patching word/scripts.js with editor.js..."
            sed -i 's/\];$/,\n\t"..\/..\/..\/..\/sdkjs\/word\/document\/editor.js"\n];/' "$WORD_SCRIPTS"
          fi
          echo "::endgroup::"

          echo "::group::Verify develop scripts"
          for mod in word cell slide; do
            f="src/sdkjs/develop/sdkjs/$mod/scripts.js"
            if [ -f "$f" ]; then
              echo "$f: $(wc -l < "$f") lines"
            else
              echo "WARNING: $f not found"
            fi
          done
          echo "::endgroup::"

      - name: Prepare fonts and AllFonts.js
        run: |
          echo "::group::prepare-fonts"
          pip3 install Pillow --quiet --break-system-packages || pip3 install Pillow --quiet
          chmod +x scripts/prepare-fonts.sh
          bash scripts/prepare-fonts.sh
          echo "::endgroup::"

          echo "::group::Verify fonts"
          echo "Font files: $(ls src/fonts/*.ttf 2>/dev/null | wc -l)"
          ls -la src/fonts/*.ttf 2>/dev/null | head -5
          if [ -f "src/sdkjs/common/AllFonts.js" ]; then
            echo "AllFonts.js: $(wc -l < src/sdkjs/common/AllFonts.js) lines"
          else
            echo "WARNING: AllFonts.js not generated"
          fi
          echo "::endgroup::"

      - name: Generate Linux icons
        run: |
          echo "::group::generate-icons"
          chmod +x scripts/generate-icons.sh
          bash scripts/generate-icons.sh
          echo "::endgroup::"

          echo "::group::Verify icons"
          ls -la src-tauri/icons/
          echo "::endgroup::"

      - name: Download x2t Linux binaries
        run: |
          chmod +x scripts/get-x2t-ci.sh
          bash scripts/get-x2t-ci.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy x2t to binaries for DoctRenderer PDF path
        run: |
          cp "src-tauri/binaries/x2t-${{ matrix.target }}" "src-tauri/binaries/x2t"
          echo "x2t resource copy created ($(wc -c < src-tauri/binaries/x2t) bytes)"

      - name: Prepare DoctRenderer resources
        env:
          DOCTRENDERER_SDKJS_TAG: ${{ matrix.sdkjs_tag }}
          DOCTRENDERER_SDKJS_REMOTE: ${{ matrix.sdkjs_remote }}
          DOCTRENDERER_SDKJS_COMMIT: ${{ matrix.sdkjs_commit }}
        run: |
          echo "::group::Copy fonts to binaries"
          mkdir -p src-tauri/binaries/fonts
          cp src/fonts/*.ttf src-tauri/binaries/fonts/
          cp src/sdkjs/common/AllFonts.js src-tauri/binaries/AllFonts.js
          echo "Fonts copied: $(ls src-tauri/binaries/fonts/*.ttf | wc -l)"
          echo "::endgroup::"

          echo "::group::Compile sdkjs for DoctRenderer"
          chmod +x scripts/compile-doctrenderer-sdkjs.sh
          export DOCTRENDERER_STAGING="$RUNNER_TEMP/doctrenderer-sdkjs"
          bash scripts/compile-doctrenderer-sdkjs.sh
          echo "::endgroup::"
          echo "::group::Create DoctRenderer directory structure"
          chmod +x scripts/prepare-doctrenderer.sh
          DOCTRENDERER_SDKJS="$DOCTRENDERER_STAGING" bash scripts/prepare-doctrenderer.sh
          echo "::endgroup::"

      - name: Verify x2t binary
        run: |
          echo "::group::x2t binary info"
          X2T="src-tauri/binaries/x2t-${{ matrix.target }}"
          if [ -f "$X2T" ]; then
            file "$X2T"
            echo "Shared library dependencies:"
            ldd "$X2T" || true
            echo "With LD_LIBRARY_PATH:"
            LD_LIBRARY_PATH="src-tauri/binaries" ldd "$X2T" || true
          else
            echo "WARNING: x2t binary not found at $X2T"
            ls -la src-tauri/binaries/x2t* 2>/dev/null || echo "No x2t files found"
          fi
          echo "::endgroup::"

      - name: Stage frontend distribution
        run: |
          echo "::group::prepare-dist"
          chmod +x scripts/prepare-dist.sh
          bash scripts/prepare-dist.sh
          echo "::endgroup::"

          echo "::group::Verify dist"
          echo "File count: $(find src-dist -type f | wc -l)"
          echo "Total size: $(du -sh src-dist | cut -f1)"
          find src-dist -type f | head -30
          echo "::endgroup::"

          LOG="/tmp/euro-office-lite/prepare-dist.log"
          if [ -f "$LOG" ]; then
            echo "::group::prepare-dist log"
            cat "$LOG"
            echo "::endgroup::"
          fi

      - name: Build Tauri app
        run: |
          set -o pipefail
          echo "Building for ${{ matrix.target }}..."
          npx tauri build \
            --target ${{ matrix.target }} \
            --config '{"bundle":{"targets":["deb"],"icon":["icons/icon.png","icons/128x128.png","icons/128x128@2x.png","icons/32x32.png","icons/256x256.png"],"resources":["binaries/*.so","binaries/*.so.*","binaries/*.config","binaries/*.dat","binaries/*.js","binaries/x2t","binaries/fonts/*","editors/sdkjs/word/*","editors/sdkjs/cell/*","editors/sdkjs/slide/*","editors/sdkjs/common/Native/*","editors/sdkjs/common/AllFonts.js","editors/sdkjs/common/libfont/engine/*","editors/web-apps/vendor/xregexp/*","templates/*"]}}' \
            2>&1 | tee /tmp/tauri-build.log

          echo "::group::Build output"
          DEB_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/deb"
          if [ -d "$DEB_DIR" ]; then
            echo "Deb output:"
            ls -lh "$DEB_DIR/"
          else
            echo "No deb directory found at $DEB_DIR"
          fi
          echo "::endgroup::"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs-linux-${{ matrix.target }}
          path: |
            /tmp/tauri-build.log
            /tmp/euro-office-lite/*.log
