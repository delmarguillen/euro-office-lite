name: macOS Dev Build

on:
  workflow_dispatch:
    inputs:
      skip_windows:
        description: 'Skip Windows build (faster macOS iteration)'
        type: boolean
        default: true
  push:
    branches:
      - 'hotfix/**'
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - '.github/workflows/build-macos-dev.yml'

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Diagnose environment
        run: |
          echo "::group::System info"
          uname -a
          sw_vers
          echo "Arch: $(uname -m)"
          echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          echo "::endgroup::"

          echo "::group::Tool versions"
          rustc --version && cargo --version
          node --version && npm --version
          python3 --version
          echo "::endgroup::"

          echo "::group::Disk space"
          df -h /
          echo "::endgroup::"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-dev-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-dev-${{ runner.os }}-${{ matrix.target }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Generate sdkjs develop scripts
        run: |
          echo "::group::grunt-develop"
          cd src/sdkjs/build
          npm ci
          npx grunt develop --desktop=true
          cd "$GITHUB_WORKSPACE"

          WORD_SCRIPTS="src/sdkjs/develop/sdkjs/word/scripts.js"
          if ! grep -q 'word/document/editor\.js' "$WORD_SCRIPTS" 2>/dev/null; then
            echo "Patching word/scripts.js with editor.js..."
            sed -i '' 's/\];$/,\n\t"..\/..\/..\/..\/sdkjs\/word\/document\/editor.js"\n];/' "$WORD_SCRIPTS"
          fi
          echo "::endgroup::"

          echo "::group::Verify develop scripts"
          for mod in word cell slide; do
            f="src/sdkjs/develop/sdkjs/$mod/scripts.js"
            if [ -f "$f" ]; then
              echo "$f: $(wc -l < "$f") lines"
            else
              echo "WARNING: $f not found"
            fi
          done
          echo "::endgroup::"

      - name: Prepare fonts and AllFonts.js
        run: |
          echo "::group::prepare-fonts"
          pip3 install Pillow --quiet --break-system-packages || pip3 install Pillow --quiet
          chmod +x scripts/prepare-fonts.sh
          bash scripts/prepare-fonts.sh
          echo "::endgroup::"

          echo "::group::Verify fonts"
          echo "Font files: $(ls src/fonts/*.ttf 2>/dev/null | wc -l)"
          ls -la src/fonts/*.ttf 2>/dev/null | head -5
          if [ -f "src/sdkjs/common/AllFonts.js" ]; then
            echo "AllFonts.js: $(wc -l < src/sdkjs/common/AllFonts.js) lines"
          else
            echo "WARNING: AllFonts.js not generated"
          fi
          echo "::endgroup::"

      - name: Generate macOS icons
        run: |
          echo "::group::generate-icons"
          chmod +x scripts/generate-icons.sh
          bash scripts/generate-icons.sh
          echo "::endgroup::"

          echo "::group::Verify icons"
          ls -la src-tauri/icons/
          echo "::endgroup::"

      - name: Download x2t macOS binaries
        run: |
          chmod +x scripts/get-x2t-ci.sh
          bash scripts/get-x2t-ci.sh ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage frontend distribution
        run: |
          echo "::group::prepare-dist"
          chmod +x scripts/prepare-dist.sh
          bash scripts/prepare-dist.sh
          echo "::endgroup::"

          echo "::group::Verify dist"
          echo "File count: $(find src-dist -type f | wc -l)"
          echo "Total size: $(du -sh src-dist | cut -f1)"
          find src-dist -type f | head -30
          echo "::endgroup::"

          LOG="${TMPDIR:-/tmp}/euro-office-lite/prepare-dist.log"
          if [ -f "$LOG" ]; then
            echo "::group::prepare-dist log"
            cat "$LOG"
            echo "::endgroup::"
          fi

      # x2t already carries @executable_path/../Frameworks, which serves the
      # sidecar in Contents/MacOS. Only the copy in Contents/Resources/binaries
      # gets ../../Frameworks, so the sidecar never searches outside the .app.
      # Adding a path it already has fails.
      - name: Fix x2t binary and its resource copy (rpath + ad-hoc re-sign)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          echo "::group::Patch x2t rpath and re-sign"
          X2T="src-tauri/binaries/x2t-$TARGET"
          COPY="src-tauri/binaries/x2t"
          # Strip ONLYOFFICE signature and re-sign ad-hoc (hardened runtime blocks execution otherwise)
          codesign --force --sign - "$X2T"
          cp "$X2T" "$COPY"
          RPATH="@executable_path/../../Frameworks"
          RPATHS=$(otool -l "$COPY" | awk '/cmd LC_RPATH$/ { getline; getline; print $2 }' | paste -sd ' ' -)
          case " $RPATHS " in
            *" $RPATH "*) echo "x2t copy already has $RPATH" ;;
            *) install_name_tool -add_rpath "$RPATH" "$COPY" ;;
          esac
          codesign --force --sign - "$COPY"
          echo "x2t resource copy created ($(wc -c < "$COPY") bytes)"
          for f in "$X2T" "$COPY"; do
            echo "rpaths of $f:"
            otool -l "$f" | grep -A2 LC_RPATH
          done
          echo "::endgroup::"

      - name: Prepare DoctRenderer resources
        # The macOS x2t (both targets) is 10.0.0.169, so the sdkjs tag has to
        # match it; that tag exists only upstream, not in this fork.
        env:
          DOCTRENDERER_SDKJS_TAG: v10.0.0.169
          DOCTRENDERER_SDKJS_REMOTE: https://github.com/ONLYOFFICE/sdkjs.git
          DOCTRENDERER_SDKJS_COMMIT: 3679e0375a758d7dc59d31337a45461be3525ed8
        run: |
          echo "::group::Copy fonts to binaries"
          mkdir -p src-tauri/binaries/fonts
          cp src/fonts/*.ttf src-tauri/binaries/fonts/
          cp src/sdkjs/common/AllFonts.js src-tauri/binaries/AllFonts.js
          echo "Fonts copied: $(ls src-tauri/binaries/fonts/*.ttf | wc -l)"
          echo "::endgroup::"

          echo "::group::Compile sdkjs for DoctRenderer"
          chmod +x scripts/compile-doctrenderer-sdkjs.sh
          export DOCTRENDERER_STAGING="$RUNNER_TEMP/doctrenderer-sdkjs"
          bash scripts/compile-doctrenderer-sdkjs.sh
          echo "::endgroup::"
          echo "::group::Create DoctRenderer directory structure"
          chmod +x scripts/prepare-doctrenderer.sh
          DOCTRENDERER_SDKJS="$DOCTRENDERER_STAGING" bash scripts/prepare-doctrenderer.sh
          echo "::endgroup::"

      # Resources copy file by file and would flatten the framework links, so
      # x2t's frameworks go to Contents/Frameworks through bundle.macOS.frameworks.
      - name: Build Tauri app
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          echo "Building for $TARGET..."
          FRAMEWORKS=$(find "$GITHUB_WORKSPACE/src-tauri/binaries" -mindepth 1 -maxdepth 1 -name '*.framework' -type d | LC_ALL=C sort | jq -R . | jq -cs .)
          if [ "$(echo "$FRAMEWORKS" | jq length)" -eq 0 ]; then
            echo "::error::no x2t frameworks in src-tauri/binaries"
            exit 1
          fi
          echo "Frameworks: $FRAMEWORKS"
          CONFIG=$(jq -cn --argjson frameworks "$FRAMEWORKS" '{"bundle":{"targets":["app","dmg"],"icon":["icons/icon.icns","icons/icon.png","icons/128x128.png","icons/32x32.png"],"resources":["binaries/*.config","binaries/*.js","binaries/x2t","binaries/fonts/*","editors/sdkjs/word/*","editors/sdkjs/cell/*","editors/sdkjs/slide/*","editors/sdkjs/common/Native/*","editors/sdkjs/common/AllFonts.js","editors/sdkjs/common/libfont/engine/*","editors/web-apps/vendor/xregexp/*","templates/*"],"macOS":{"frameworks":$frameworks}}}')
          npx tauri build \
            --target "$TARGET" \
            --config "$CONFIG" \
            2>&1 | tee /tmp/tauri-build.log

          echo "::group::Build output"
          DMG_DIR="src-tauri/target/$TARGET/release/bundle/dmg"
          APP_DIR="src-tauri/target/$TARGET/release/bundle/macos"
          if [ -d "$DMG_DIR" ]; then
            echo "DMG output:"
            ls -lh "$DMG_DIR/"
          fi
          if [ -d "$APP_DIR" ]; then
            echo "App bundle:"
            ls -lh "$APP_DIR/"
          fi
          echo "::endgroup::"

      - name: Sign and notarize macOS app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Not used by the script (identity is derived from keychain), but referencing it
          # makes GitHub mask the certificate name in logs (Authority= lines in verify step)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured, skipping code signing"
            exit 0
          fi

          APP="src-tauri/target/$TARGET/release/bundle/macos/Euro-Office-Lite.app"
          DMG_DIR="src-tauri/target/$TARGET/release/bundle/dmg"

          # --- Import certificate into temporary keychain ---
          echo "::group::Import certificate"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          trap 'security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true' EXIT
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          APPLE_SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::No codesigning identity found in temporary keychain"
            exit 1
          fi
          echo "Certificate imported"
          echo "::endgroup::"

          # --- Sign inside out: loose Mach-O files, each framework, the .app ---
          echo "::group::Sign binaries"
          SIGNED_COUNT=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -qE "Mach-O"; then
              codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$f"
              SIGNED_COUNT=$((SIGNED_COUNT + 1))
              echo "  Signed: ${f#$APP/}"
            fi
          done < <(find "$APP/Contents" -type f -not -path '*.framework/*' -print0 2>/dev/null)

          # A framework is signed as a bundle, which seals Versions/Current;
          # signing its binary as a loose file would leave the bundle unsealed.
          FRAMEWORK_COUNT=0
          while IFS= read -r -d '' fw; do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$fw"
            FRAMEWORK_COUNT=$((FRAMEWORK_COUNT + 1))
            echo "  Signed: ${fw#$APP/}"
          done < <(find "$APP/Contents/Frameworks" -mindepth 1 -maxdepth 1 -name '*.framework' -type d -print0 2>/dev/null)
          if [ "$FRAMEWORK_COUNT" -eq 0 ]; then
            echo "::error::no frameworks in $APP/Contents/Frameworks"
            exit 1
          fi
          SIGNED_COUNT=$((SIGNED_COUNT + FRAMEWORK_COUNT))

          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$APP"
          SIGNED_COUNT=$((SIGNED_COUNT + 1))
          echo "Signed $SIGNED_COUNT items total ($FRAMEWORK_COUNT frameworks, nested binaries + .app bundle)"
          echo "::endgroup::"

          # --- Verify signature before notarization ---
          echo "::group::Pre-notarization verification"
          codesign --verify --deep --strict "$APP" 2>&1
          echo "Signature verification passed"
          echo "::endgroup::"

          # --- Notarize ---
          echo "::group::Notarize"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app-notarize.zip"
          echo "Submitting for notarization ($(du -h "$RUNNER_TEMP/app-notarize.zip" | cut -f1) zip)..."

          NOTARIZE_OUTPUT=$(xcrun notarytool submit "$RUNNER_TEMP/app-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 1800 2>&1) || true

          echo "$NOTARIZE_OUTPUT"
          rm "$RUNNER_TEMP/app-notarize.zip"

          SUBMISSION_ID=$(echo "$NOTARIZE_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)

          if echo "$NOTARIZE_OUTPUT" | grep -qi "status: Accepted"; then
            echo "Notarization accepted"
          else
            echo "::error::Notarization failed"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Fetching notarization log for $SUBMISSION_ID..."
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" 2>&1 || true
            fi
            exit 1
          fi
          echo "::endgroup::"

          # --- Staple ---
          echo "::group::Staple"
          xcrun stapler staple "$APP"
          echo "::endgroup::"

          # --- Recreate DMG with signed+notarized .app ---
          echo "::group::Recreate DMG"
          rm -f "$DMG_DIR"/*.dmg

          DMG_STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$DMG_STAGING"
          cp -R "$APP" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"

          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          ARCH=$(echo "$TARGET" | cut -d'-' -f1)
          DMG_PATH="$DMG_DIR/Euro-Office-Lite_${VERSION}_${ARCH}.dmg"

          hdiutil create -volname "Euro-Office Lite" -srcfolder "$DMG_STAGING" -ov -format UDZO "$DMG_PATH"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_PATH"

          echo "Submitting DMG for notarization..."
          DMG_NOTARIZE_OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 1800 2>&1) || true

          echo "$DMG_NOTARIZE_OUTPUT"

          DMG_SUBMISSION_ID=$(echo "$DMG_NOTARIZE_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)

          if echo "$DMG_NOTARIZE_OUTPUT" | grep -qi "status: Accepted"; then
            echo "DMG notarization accepted"
          else
            echo "::error::DMG notarization failed"
            if [ -n "$DMG_SUBMISSION_ID" ]; then
              echo "Fetching notarization log for $DMG_SUBMISSION_ID..."
              xcrun notarytool log "$DMG_SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" 2>&1 || true
            fi
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"

          rm -rf "$DMG_STAGING"
          echo "DMG created: $(basename "$DMG_PATH") ($(du -h "$DMG_PATH" | cut -f1))"
          echo "::endgroup::"

      - name: Verify code signature
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No signing configured, skipping verification"
            exit 0
          fi

          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Euro-Office-Lite.app"
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"

          echo "::group::Signature details"
          codesign -dv --verbose=4 "$APP" 2>&1
          echo "::endgroup::"

          echo "::group::Deep signature verification"
          codesign --verify --deep --strict "$APP" 2>&1
          echo "::endgroup::"

          echo "::group::Gatekeeper assessment"
          spctl -a -t exec -vv "$APP" 2>&1
          echo "::endgroup::"

          echo "::group::Staple validation (.app)"
          xcrun stapler validate "$APP" 2>&1
          echo "::endgroup::"

          DMG=$(find "$DMG_DIR" -name '*.dmg' -print -quit 2>/dev/null)
          if [ -n "$DMG" ]; then
            echo "::group::Staple validation (.dmg)"
            xcrun stapler validate "$DMG" 2>&1
            echo "::endgroup::"
          fi

          echo "::group::All Mach-O binaries in bundle"
          find "$APP" -type f -print0 | xargs -0 file | grep "Mach-O" | while IFS=: read -r path _; do
            sig=$(codesign -dv "$path" 2>&1 | grep "Authority=" | head -1)
            echo "  ${path#$APP/}: $sig"
          done
          echo "::endgroup::"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dmg-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs-macos-${{ matrix.target }}
          path: |
            /tmp/tauri-build.log
            /tmp/euro-office-lite/*.log
