name: Rust unit tests

# Job aparte del pipeline de release a propósito: no alargar el camino al tag.
# Cubre la lógica pura del backend (ver src-tauri/src/file_ops.rs, mod tests).
# NO cubre el empaquetado ni la conversión real con x2t: eso lo siguen validando
# los builds y las máquinas de prueba.

on:
  push:
    paths:
      - 'src-tauri/**'
      - 'tools/corpus/**'
      - 'patches/**'
      - 'scripts/apply-patches.mjs'
      - 'scripts/test-sdkjs-*.mjs'
      - 'scripts/test-bridge-*.mjs'
      - 'scripts/test-frontend-*.mjs'
      - 'scripts/frontend-unused-files.mjs'
      - 'scripts/build-frontend-prod.mjs'
      - 'scripts/validate-frontend-prod.mjs'
      - 'scripts/bridge-test-harness.mjs'
      - 'scripts/sdkjs-word-test-harness.mjs'
      - 'scripts/spell-languages.mjs'
      - 'scripts/check-budget.mjs'
      - 'scripts/test-check-budget.mjs'
      - 'scripts/measure-open.mjs'
      - 'ci/budgets.json'
      - 'src/bridge.js'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'tools/corpus/**'
      - 'patches/**'
      - 'scripts/apply-patches.mjs'
      - 'scripts/test-sdkjs-*.mjs'
      - 'scripts/test-bridge-*.mjs'
      - 'scripts/test-frontend-*.mjs'
      - 'scripts/frontend-unused-files.mjs'
      - 'scripts/build-frontend-prod.mjs'
      - 'scripts/validate-frontend-prod.mjs'
      - 'scripts/bridge-test-harness.mjs'
      - 'scripts/sdkjs-word-test-harness.mjs'
      - 'scripts/spell-languages.mjs'
      - 'scripts/check-budget.mjs'
      - 'scripts/test-check-budget.mjs'
      - 'scripts/measure-open.mjs'
      - 'ci/budgets.json'
      - 'src/bridge.js'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-22.04

    steps:
      # Sin submodules: los tests no tocan sdkjs ni web-apps, y traerlos aquí
      # costaría más que compilar el crate.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # The corpus crate includes src-tauri/src/x2t_task.rs and text_import.rs
      # by path: building it here fails as soon as either file needs Tauri or
      # names crate::, and runs their unit tests without the app's dependencies.
      - name: Corpus crate tests
        run: cargo test --locked --manifest-path tools/corpus/Cargo.toml

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-tests-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tests-

      # frontendDist (../src-dist) lo genera prepare-dist.sh en el pipeline de
      # build; acá alcanza con que el directorio exista.
      - name: Create frontend placeholder
        run: |
          mkdir -p src-dist
          echo '<!doctype html><title>test placeholder</title>' > src-dist/index.html

      # tauri_build::build() valida la config entera antes de compilar: exige el
      # externalBin binaries/x2t-<target-triple> y que CADA glob de
      # bundle.resources matchee algún archivo. Todo eso lo produce el pipeline
      # de build (get-x2t-ci.sh, prepare-dist.sh, submódulos), y traerlo aquí
      # costaría descargar ~100 MB de x2t para tests que no lo ejecutan.
      # TAURI_CONFIG (mismo merge que usa --config) desactiva el bundle en este
      # job: se compila y se corren las aserciones, no se empaqueta nada. No
      # puede enmascarar un problema de empaquetado porque de eso responden los
      # workflows de build, que sí arman el .deb completo.
      - name: Run tests
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"resources":[],"externalBin":[]}}'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  sdkjs-patch-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The scripts read sdkjs files with patches/sdkjs applied; the cell style
      # tests also open the cell style dialog of web-apps with its patches.
      - name: Fetch the sdkjs and web-apps submodules
        run: git submodule update --init --depth 1 src/sdkjs src/web-apps

      - name: Apply the sdkjs and web-apps patches
        run: node scripts/apply-patches.mjs apply --only sdkjs,web-apps

      - name: Custom function library tests
        run: node scripts/test-sdkjs-custom-functions.mjs

      - name: Screen reader text tests
        run: node scripts/test-sdkjs-speech.mjs

      - name: PDF JavaScript action tests
        run: node scripts/test-sdkjs-pdf-no-javascript.mjs

      - name: Cell style editing tests
        run: node scripts/test-sdkjs-cell-styles.mjs

      - name: Table of contents page number tests
        run: node scripts/test-sdkjs-toc-page-numbers.mjs

      - name: Caption chapter number tests
        run: node scripts/test-sdkjs-caption-chapter-number.mjs

      - name: Caption chapter restart tests
        run: node scripts/test-sdkjs-caption-chapter-restart.mjs

      - name: Bridge tests
        run: |
          for test in scripts/test-bridge-*.mjs; do
            node "$test"
          done

      - name: Production frontend tests
        run: node scripts/test-frontend-unused-files.mjs

      - name: CI budget tests
        run: node scripts/test-check-budget.mjs
